# Manual only (Actions -> "Admin password reset" -> Run workflow). Resets the login password of students an admin queued
# in the portal (Students tab -> "Queue admin reset"). Uses the Firebase Admin SDK, so the old password is NOT needed.
# Needs the same FIREBASE_SERVICE_ACCOUNT secret as the AI job. The repository is public: this job never prints names,
# PS-IDs or passwords; per-student outcomes are written to the portal (Students tab -> "Reset requests").
name: Admin password reset

on:
  workflow_dispatch: {}

concurrency:
  group: password-reset
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node reset.test.mjs
      - run: node reset-passwords.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
